[project]
name = "stockmind-ai"
version = "0.1.0"
description = "StockMind AI: reinforcement learning (DQN, REINFORCE, PPO, A2C with TorchRL) for retail inventory ordering"
readme = "README.md"
authors = [
    { name = "Dankagame", email = "k.dan@alustudent.com" }
]
requires-python = ">=3.11.9"
dependencies = [
    "gymnasium>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=7.2.0",
    "pygame>=2.6.1",
    "pytest>=9.2.0",
    "torch>=2.15.0",
    "torchrl>=0.15.0",
]

[project.scripts]
stockmind-ai = "stockmind_ai:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
